<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英文面試｜北大 × 陽明交大</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">ENGLISH INTERVIEW</div><h1>英文面試｜依北大 × 陽明交大考古方向</h1><p>主軸已改成兩校實際考古反覆出現的AI／科技、國際、財務、ESG、管理與研究方法。廣告題只保留少量作為你的個人背景延伸，不再當核心題庫。</p><div class="tiles"><a class="tile" href="#nycu"><span class="tile-icon">🎯</span>陽明交大核心<small>AI／科技／統計／財務／ESG</small></a><a class="tile" href="#ntpu"><span class="tile-icon">🏫</span>北大核心<small>數位轉型／GPT／國際／研究</small></a><a class="tile" href="#personal"><span class="tile-icon">🎙️</span>個人英文<small>自介／動機／研究</small></a><a class="tile" href="group.html"><span class="tile-icon">👥</span>同場口試<small>搶答／輪答／追問</small></a></div></header><section class="section" id="nycu"><h2>陽明交大｜考古核心英文與專業議題</h2><div id="ny"></div></section><section class="section" id="ntpu"><h2>北大｜近期考古核心議題</h2><div id="nt"></div></section><section class="section" id="personal"><h2>個人英文面試</h2><div id="pe"></div></section></main><script src="nycu-core-issues.js"></script><script src="ntpu-core-issues.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="bilingual-fixes.js"></script><script>
function issueCard(z,i){return '<details><summary><span class="chip">'+z.type+' · '+z.year+'</span><span class="chip">'+z.cat+'</span><div class="en">'+z.qEn+'</div><div class="small">'+z.qZh+'</div></summary><div class="box warm"><b>為什麼要準備</b><br>'+z.why+'</div><div class="box"><b>答題骨架</b><ol>'+z.logic.map(a=>'<li>'+a+'</li>').join('')+'</ol></div><div class="box"><b>English answer</b><br>'+z.answerEn+'</div><div class="box blue"><b>中文理解／回答</b><br>'+z.answerZh+'</div><div class="box"><b>如果前面的人已經講過</b><br>'+z.later+'</div><div class="box warm"><b>教授可能追問</b><ul>'+z.follow.map(a=>'<li>'+a+'</li>').join('')+'</ul></div>'+(z.source&&z.source.startsWith('http')?'<a class="src" href="'+z.source+'" target="_blank" rel="noopener">查看考生心得來源 ↗</a>':'')+'</details>'}
ny.innerHTML=NYCU_CORE_ISSUES.map(issueCard).join('');nt.innerHTML=NTPU_CORE_ISSUES.map(issueCard).join('');
const cats=["基本","校系","研究","工作","職涯","壓力","臨場"];const personals=ENGLISH_BANK.filter(x=>cats.includes(x[0]));pe.innerHTML=personals.map((x,i)=>'<details><summary><span class="chip">'+x[0]+'</span><div class="en">'+x[1]+'</div><div class="small">'+x[2]+'</div></summary><div class="box"><b>English answer</b><br>'+x[4]+'</div><div class="box blue"><b>中文答案</b><br>'+x[5]+'</div><div class="box warm"><b>Follow-up</b><br>'+x[6]+'</div><div class="box"><b>Follow-up answer</b><br>'+x[7]+'</div></details>').join('');
</script><script src="site-enhance.js"></script></body></html>
