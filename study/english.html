<!doctype html><html lang="zh-Hant"><head><title>英文面試完整訓練</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#ccc7d4;line-height:1.65}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.tabs button,.btn{border:0;background:#fff;border-radius:99px;padding:9px 12px;white-space:nowrap;font-weight:700}.tabs button.on,.primary{background:#6557e8;color:#fff}.card,details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}summary{font-weight:800;line-height:1.55}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.7}.cn{background:#f0edff}.follow{background:#fff7e8}.tag{font-size:11px;color:#6557e8;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.link{display:block;background:#eeeaff;color:#5d50d8;text-decoration:none;padding:12px;border-radius:13px;font-weight:800}.small{font-size:12px;color:#706b79}.en{font-size:16px;line-height:1.65}.q{font-size:18px;font-weight:850;line-height:1.5}button{font:inherit}</style></head><body><main class="w"><div class="hero"><span class="tag">ENGLISH INTERVIEW</span><h1>英文面試｜不是10題背稿</h1><p>基本題、校系／考古型、研究方法與統計、工作實務、職涯、壓力題、臨場題，再加獨立 English Issues。每題都有英文答案、中文、追問與追問答案。</p><div class="grid"><a class="link" href="group.html">雙語團體面試</a><a class="link" href="cases.html">深度情境案例</a><a class="link" href="mock.html">完整模擬</a><a class="link" href="index.html">回每日課表</a></div></div><div class="tabs" id="tabs"></div><div id="list"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="issues.js"></script><script>let mode='全部';const cats=['全部',...new Set(ENGLISH_BANK.map(x=>x[0])),'英文議題'];function draw(){tabs.innerHTML=cats.map(c=>'<button class="'+(mode===c?'on':'')+'" onclick="mode='+JSON.stringify(c)+';draw()">'+c+'</button>').join('');if(mode==='英文議題'){list.innerHTML=ISSUE_BANK.map((x,i)=>'<details><summary><span class="tag">ISSUE '+(i+1)+'</span><br>'+x[0]+'<br><span class="en">'+x[1]+'</span></summary><div class="box cn"><b>中文思路</b><br>'+x[2]+'</div><div class="box"><b>English answer</b><br><span class="en">'+x[3]+'</span></div><div class="box follow"><b>Professor follow-up</b><br><span class="en">'+x[4]+'</span><hr><b>Your response</b><br><span class="en">'+x[5]+'</span></div></details>').join('');return}let a=ENGLISH_BANK.filter(x=>mode==='全部'||x[0]===mode);list.innerHTML=a.map((x,i)=>'<details><summary><span class="tag">'+x[0]+'</span><br><span class="en">'+x[1]+'</span><br><small>'+x[2]+'</small></summary><div class="box"><b>教授在看什麼</b><br>'+x[3]+'</div><div class="box"><b>English answer</b><br><span class="en">'+x[4]+'</span></div><div class="box cn"><b>中文完整意思</b><br>'+x[5]+'</div><div class="box follow"><b>Follow-up</b><br><span class="en">'+x[6]+'</span><hr><b>Follow-up answer</b><br><span class="en">'+x[7]+'</span><br><small>'+x[8]+'</small></div></details>').join('')}draw()</script></body></html>
