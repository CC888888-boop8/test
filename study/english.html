<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文面試完整題庫</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#ccc7d4;line-height:1.6}.filter{display:flex;gap:7px;overflow:auto;padding:14px 0}.filter button{border:0;background:#fff;border-radius:99px;padding:9px 12px;white-space:nowrap}details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}summary{font-weight:800;line-height:1.5}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.7}.cn{background:#f0edff}.follow{background:#fff7e8}.tag{font-size:11px;color:#6557e8;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}</style></head><body><main class="w"><div class="hero"><h1>英文面試完整題庫</h1><p>基本題、校系／考古型、研究、工作、職涯、行銷議題、壓力與臨場追問。每題都有英文答案＋中文翻譯＋追問答案。</p></div><div class="filter" id="filters"></div><div id="list"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="english-1.js"></script><script src="english-2.js"></script><script>const cats=['全部',...new Set(ENGLISH_BANK.map(x=>x[0]))];let cur='全部';function draw(){list.innerHTML=ENGLISH_BANK.filter(x=>cur==='全部'||x[0]===cur).map((x,i)=>`<details><summary><span class="tag">${x[0]}</span><br>${x[1]}<br><small>${x[2]}</small></summary><div class="box"><b>教授在看什麼</b><br>${x[3]}</div><div class="box"><b>English answer</b><br>${x[4]}</div><div class="box cn"><b>中文</b><br>${x[5]}</div><div class="box follow"><b>Follow-up</b><br>${x[6]}<hr>${x[7]}<br><small>${x[8]}</small></div></details>`).join('')}filters.innerHTML=cats.map(c=>`<button onclick="cur='${c}';draw()">${c}</button>`).join('');draw();</script></body></html>
