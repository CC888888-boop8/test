<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jenna Study Sprint</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">10/7—10/31 · NTPU × NYCU</div><h1>每日指定練習｜北大企管 × 陽明交大經管</h1><p>每天指定研究、統計、中文、英文、國際議題、校系考古、多人同場口試、常用英文與TOEIC。多人同場的練法已依兩校歷年實際流程修正為個答／搶答／教授追問。</p><div class="tiles"><a class="tile" href="schools.html"><span class="tile-icon">🏫</span>雙校專區<small>北大／陽明交大</small></a><a class="tile" href="international.html"><span class="tile-icon">🌍</span>國際＋AI議題<small>依考古方向擴充</small></a><a class="tile" href="group.html"><span class="tile-icon">👥</span>同場口試<small>輪答／搶答／追問</small></a><a class="tile" href="research.html"><span class="tile-icon">🔬</span>研究＋統計<small>從零教懂</small></a></div></header><div class="daystrip" id="days"></div><div id="out"></div></main><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="nycu-core-issues.js"></script><script src="ntpu-core-issues.js"></script><script src="deep-research.js"></script><script src="deep-stats.js"></script><script src="deep-issues.js"></script><script src="school-prep.js"></script><script src="interview-format.js"></script><script src="same-room-extra.js"></script><script src="intl-a.js"></script><script src="intl-b.js"></script><script src="intl-c.js"></script><script src="intl-d.js"></script><script src="toeic-data.js"></script><script src="toeic-extra.js"></script><script src="phrases-data.js"></script><script src="history-data.js"></script><script src="history-extra.js"></script><script src="history-verified.js"></script><script src="daily-plan.js"></script><script>
const INTL=[...INTL_A,...INTL_B,...INTL_C,...INTL_D],DRILLS=[...SAME_ROOM_DRILLS,...SAME_ROOM_EXTRA],TQ=[...TOEIC_Q,...TOEIC_EXTRA_Q],CN=[...STUDY.interviews,...MORE_INTERVIEWS],HIST=[...HISTORY_BANK,...HISTORY_EXTRA,...VERIFIED_HISTORY].filter(a=>a[0]==="北大企管"||a[0]==="陽明交大經管");let d=0;
function task(title,html,url){return '<section class="card"><h3>'+title+'</h3>'+html+'<p><a class="practice" href="'+url+'">進入完整練習 →</a></p></section>'}
function draw(){const p=DAILY_PLAN[d];days.innerHTML=DAILY_PLAN.map((z,i)=>'<button class="'+(i===d?'active':'')+'" onclick="d='+i+';draw()"><b>D'+z.day+'</b><br><small>'+z.date+'</small></button>').join('');
const r=DEEP_RESEARCH_A[d%DEEP_RESEARCH_A.length],st=DEEP_STATS_A[d%DEEP_STATS_A.length],school=d%2===0?SCHOOL_PREP.ntpu:SCHOOL_PREP.nycu,intl=INTL[d%INTL.length],en=[0,1,2,3].map(k=>ENGLISH_BANK[(d*4+k)%ENGLISH_BANK.length]),cn=[0,1,2,3].map(k=>CN[(d*4+k)%CN.length]),hist=[0,1,2].map(k=>HIST[(d*3+k)%HIST.length]),voc=[0,1,2,3,4,5,6,7].map(k=>TOEIC_VOCAB[(d*8+k)%TOEIC_VOCAB.length]),phr=[0,1,2,3,4].map(k=>PHRASE_BANK[(d*5+k)%PHRASE_BANK.length]),tq=[0,1,2,3,4].map(k=>TQ[(d*5+k)%TQ.length]),target=d%2===0?"北大":"陽明交大",ds=DRILLS.filter(z=>z.school===target),drill=ds[d%ds.length];
let html='<section class="card"><span class="chip">DAY '+p.day+' · '+p.phase+'</span><h2>'+p.date+'</h2><div class="meta">總量約2.5–3小時；時間不足時優先：研究／統計 → 校系時事 → 個答口試 → TOEIC。</div></section>';
html+=task('🔬 研究＋統計｜40–50 min','<div class="box blue"><b>研究：</b>'+r.title+'</div><div class="box"><b>統計：</b>'+st.title+'</div><div class="small">今天要能：白話解釋 → 套入你的X/M/Y → 接教授追問。</div>','research.html');
html+=task('🎓 中文個人面試｜25–30 min',cn.map((a,i)=>(i+1)+'. '+a[0]).join('<br>'),'interview.html');
const core=(d%2===0?NTPU_CORE_ISSUES:NYCU_CORE_ISSUES)[d%(d%2===0?NTPU_CORE_ISSUES.length:NYCU_CORE_ISSUES.length)];html+=task('🎙️ English Interview｜30–35 min',en.map((a,i)=>(i+1)+'. '+a[1]+'<br><span class="small">'+a[2]+'</span>').join('<br>')+'<div class="box"><b>今日雙校核心議題</b><br>'+core.qEn+'<br><span class="small">'+core.qZh+'</span></div>','english.html');
html+=task('🌍 國際／AI議題｜25–30 min','<div class="box warm"><b>'+intl.school+'</b><br>'+intl.title+'</div><div>'+intl.qZh+'</div><div class="small">'+intl.qEn+'</div>','international.html');
html+=task('🏫 北大／陽明交大｜20 min','<b>'+(d%2===0?'北大企管':'陽明交大經管')+'</b><br>'+school.extend[d%school.extend.length][0]+'<div class="box"><b>今日3題考古</b><br>'+hist.map((a,i)=>(i+1)+'. '+a[2]+'（'+a[0]+'）').join('<br>')+'</div>','schools.html');
if(d>=4)html+=task('👥 多人同場口試｜20–30 min','<span class="chip">'+drill.school+' · '+drill.type+'</span><br><b>'+drill.q+'</b><div class="box"><b>你的作答時間：</b>'+drill.time+'<br>先完整個答，再練「前面的人已經講過時，我怎麼補新角度」。</div>','group.html');
html+=task('🗣️ 常用英文｜15 min',phr.map(a=>'<b>'+a[0]+'</b> — '+a[2]).join('<br>'),'phrases.html');
html+=task('📝 TOEIC｜35–45 min','<b>今日8組字彙</b><br>'+voc.map(a=>a[0]+' — '+a[3]).join('<br>')+'<div class="box"><b>今日5題</b><br>'+tq.map(a=>a[0]+'｜'+a[1]).join('<br>')+'</div>','toeic.html');
if(d>=17)html+=task('⏱️ 雙校Mock｜30–45 min','從今天起至少跑一輪依北大／交大實際口試型態設計的模擬。','mock.html');
out.innerHTML=html}draw();
</script><script src="site-enhance.js"></script></body></html>
