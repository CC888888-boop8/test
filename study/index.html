<!doctype html><html lang="zh-Hant"><head><title>Jenna Study Sprint 完整版</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#ccc7d4;line-height:1.65}.daybar{display:flex;gap:7px;overflow:auto;padding:12px 0}.daybar button{border:0;background:#fff;border-radius:12px;padding:9px;min-width:58px}.daybar button.on{background:#6557e8;color:#fff}.card{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.65}.tag{font-size:11px;color:#6557e8;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}.link{display:inline-block;background:#eeeaff;color:#5d50d8;text-decoration:none;padding:9px 11px;border-radius:10px;font-weight:800;margin:3px}.task{border-left:4px solid #6557e8}.small{font-size:12px;color:#706b79}h3{margin:4px 0 8px}</style></head><body><main class="w"><div class="hero"><span class="tag" style="color:#cfc8ff">10/7—10/31 · 25 DAYS</span><h1>每天不是標題，是指定練習</h1><p>題庫擴充後已重新排課。每天直接列：研究、中文面試、英文面試、English Issue、團體／Case、常用英文、TOEIC 字句與題目；後期自動提高壓力與模擬比重。</p><a class="link" href="english.html">英文完整題庫</a><a class="link" href="group.html">雙語團體</a><a class="link" href="cases.html">Cases</a><a class="link" href="mock.html">完整模擬</a></div><div class="daybar" id="days"></div><div id="x"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="issues.js"></script><script src="issues-more.js"></script><script>window.ALL_ISSUES=[...ISSUE_BANK,...ISSUE_MORE]</script><script src="group2.js"></script><script src="group-more.js"></script><script src="toeic-data.js"></script><script src="phrases-data.js"></script><script src="daily-plan.js"></script><script>let d=0;function draw(){days.innerHTML=DAILY_PLAN.map((p,i)=>'<button class="'+(i===d?'on':'')+'" onclick="d='+i+';draw()"><b>D'+p.day+'</b><br><small>'+p.date+'</small></button>').join('');let p=DAILY_PLAN[d],cn=[...STUDY.interviews,...MORE_INTERVIEWS];let e=p.enIds.map(i=>ENGLISH_BANK[i%ENGLISH_BANK.length]),cs=p.cnIds.map(i=>cn[i%cn.length]),phr=[];for(let k=0;k<5;k++)phr.push(PHRASE_BANK[(d*5+k)%PHRASE_BANK.length]);let voc=[];for(let k=0;k<8;k++)voc.push(TOEIC_VOCAB[(d*8+k)%TOEIC_VOCAB.length]);let tq=p.toeicQIds.map(i=>TOEIC_Q[i]);x.innerHTML='<div class="card"><span class="tag">DAY '+p.day+' · '+p.phase+'</span><h2>'+p.date+' 今日課表</h2><b>研究：</b>'+p.research+'<br><b>中文：</b>'+p.cn+(p.mock?'<div class="box"><b>'+p.mock+'</b></div>':'')+'</div>'+task('🧠 研究理解 20–25 min','<b>'+p.research+'</b><br>今天要做到：能不用術語解釋、能舉自己研究的例子、能接一層教授追問。','research.html')+task('🎓 中文面試 30–35 min',cs.map((a,i)=>(i+1)+'. '+a[0]).join('<br>'),'interview.html')+task('🎙️ English Interview 30–35 min',e.map((a,i)=>(i+1)+'. '+a[1]+'<br><span class="small">'+a[2]+'</span>').join('<br>')+'<div class="box"><b>English Issue</b><br>'+ALL_ISSUES[(d*2)%ALL_ISSUES.length][1]+'</div>','english.html')+(p.groupIds.length?task('👥 Group / Case 20–30 min','<b>Group：</b>'+((d%2===0?GROUP2[p.groupIds[0]%GROUP2.length][1]:GROUP_MORE[d%GROUP_MORE.length][1]))+'<br><b>Case：</b>'+CASE2[p.caseIds[0]][0],'group.html'):'')+task('💬 常用英文 15–20 min',phr.map(a=>'<b>'+a[0]+'</b> — '+a[2]).join('<br>'),'phrases.html')+task('📝 TOEIC 30–40 min','<b>今日8組字句</b><br>'+voc.map(a=>a[0]+' — '+a[3]).join('<br>')+'<div class="box"><b>今日3題</b><br>'+tq.map(a=>a[0]+'｜'+a[1]).join('<br>')+'</div>','toeic.html')}function task(t,c,l){return '<div class="card task"><h3>'+t+'</h3><div>'+c+'</div><p><a class="link" href="'+l+'">進入完整練習</a></p></div>'}draw()</script></body></html>
