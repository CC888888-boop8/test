<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jenna Study Sprint</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">10/7—10/31 · NTPU × NYCU</div><h1>每日指定練習｜北大企管 × 陽明交大經管</h1><p>每天直接指定研究、統計、中文、英文、國際議題、校系考古、Group／Case、常用英文與TOEIC。題庫擴充後每日內容同步更新。</p><div class="tiles"><a class="tile" href="schools.html"><span class="tile-icon">🏫</span>雙校專區<small>北大／陽明交大</small></a><a class="tile" href="international.html"><span class="tile-icon">🌍</span>國際＋AI議題<small>依考古方向擴充</small></a><a class="tile" href="research.html"><span class="tile-icon">🔬</span>研究＋統計<small>從零教懂</small></a><a class="tile" href="mock.html"><span class="tile-icon">🎤</span>完整模擬<small>中英＋研究＋時事</small></a></div></header><div class="daystrip" id="days"></div><div id="out"></div></main><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="deep-research.js"></script><script src="deep-stats.js"></script><script src="deep-issues.js"></script><script src="school-prep.js"></script><script src="group2.js"></script><script src="group-more.js"></script><script src="deep-group.js"></script><script src="intl-a.js"></script><script src="intl-b.js"></script><script src="intl-c.js"></script><script src="intl-d.js"></script><script src="intl-group.js"></script><script src="toeic-data.js"></script><script src="toeic-extra.js"></script><script src="phrases-data.js"></script><script src="history-data.js"></script><script src="history-extra.js"></script><script src="history-verified.js"></script><script src="daily-plan.js"></script><script>
const INTL=[...INTL_A,...INTL_B,...INTL_C,...INTL_D],TQ=[...TOEIC_Q,...TOEIC_EXTRA_Q],CN=[...STUDY.interviews,...MORE_INTERVIEWS],HIST=[...HISTORY_BANK,...HISTORY_EXTRA,...VERIFIED_HISTORY].filter(a=>a[0]==="北大企管"||a[0]==="陽明交大經管");let d=0;
function task(title,html,url){return '<section class="card"><h3>'+title+'</h3>'+html+'<p><a class="practice" href="'+url+'">進入完整練習 →</a></p></section>'}
function draw(){const p=DAILY_PLAN[d];days.innerHTML=DAILY_PLAN.map((z,i)=>'<button class="'+(i===d?'active':'')+'" onclick="d='+i+';draw()"><b>D'+z.day+'</b><br><small>'+z.date+'</small></button>').join('');
const r=DEEP_RESEARCH_A[d%DEEP_RESEARCH_A.length],st=DEEP_STATS_A[d%DEEP_STATS_A.length],school=d%2===0?SCHOOL_PREP.ntpu:SCHOOL_PREP.nycu,intl=INTL[d%INTL.length],en=[0,1,2,3].map(k=>ENGLISH_BANK[(d*4+k)%ENGLISH_BANK.length]),cn=[0,1,2,3].map(k=>CN[(d*4+k)%CN.length]),hist=[0,1,2].map(k=>HIST[(d*3+k)%HIST.length]),voc=[0,1,2,3,4,5,6,7].map(k=>TOEIC_VOCAB[(d*8+k)%TOEIC_VOCAB.length]),phr=[0,1,2,3,4].map(k=>PHRASE_BANK[(d*5+k)%PHRASE_BANK.length]),tq=[0,1,2,3,4].map(k=>TQ[(d*5+k)%TQ.length]);
let html='<section class="card"><span class="chip">DAY '+p.day+' · '+p.phase+'</span><h2>'+p.date+'</h2><div class="meta">總量約2.5–3小時；時間不足時優先：研究／統計 → 校系時事 → 面試 → TOEIC。</div></section>';
html+=task('🔬 研究＋統計｜40–50 min','<div class="box blue"><b>研究：</b>'+r.title+'</div><div class="box"><b>統計：</b>'+st.title+'</div><div class="small">今天要能：白話解釋 → 套入你的X/M/Y → 接教授追問。</div>','research.html');
html+=task('🎓 中文個人面試｜25–30 min',cn.map((a,i)=>(i+1)+'. '+a[0]).join('<br>'),'interview.html');
html+=task('🎙️ English Interview｜30–35 min',en.map((a,i)=>(i+1)+'. '+a[1]+'<br><span class="small">'+a[2]+'</span>').join('<br>')+'<div class="box"><b>今日深度English Issue</b><br>'+DEEP_ISSUES[d%DEEP_ISSUES.length].q+'<br><span class="small">'+DEEP_ISSUES[d%DEEP_ISSUES.length].zh+'</span></div>','english.html');
html+=task('🌍 國際／AI議題｜25–30 min','<div class="box warm"><b>'+intl.school+'</b><br>'+intl.title+'</div><div>'+intl.qZh+'</div><div class="small">'+intl.qEn+'</div>','international.html');
html+=task('🏫 北大／陽明交大｜20 min','<b>'+(d%2===0?'北大企管':'陽明交大經管')+'</b><br>'+school.extend[d%school.extend.length][0]+'<div class="box"><b>今日3題考古</b><br>'+hist.map((a,i)=>(i+1)+'. '+a[2]+'（'+a[0]+'）').join('<br>')+'</div>','schools.html');
if(d>=6)html+=task('👥 Group／Case｜25–35 min','<b>國際Group：</b>'+INTL_GROUP[d%INTL_GROUP.length].title+'<br><b>深度Group：</b>'+DEEP_GROUP[d%DEEP_GROUP.length].title+'<br><b>Case：</b>'+CASE2[d%CASE2.length][0],'group.html');
html+=task('🗣️ 常用英文｜15 min',phr.map(a=>'<b>'+a[0]+'</b> — '+a[2]).join('<br>'),'phrases.html');
html+=task('📝 TOEIC｜35–45 min','<b>今日8組字彙</b><br>'+voc.map(a=>a[0]+' — '+a[3]).join('<br>')+'<div class="box"><b>今日5題</b><br>'+tq.map(a=>a[0]+'｜'+a[1]).join('<br>')+'</div>','toeic.html');
if(d>=17)html+=task('⏱️ Mock｜30–45 min','從今天起每日至少跑一輪完整模擬，包含研究、統計、英文時事與Group。','mock.html');
out.innerHTML=html}draw();
</script><script src="site-enhance.js"></script></body></html>
