<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOEIC 多益</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19181e;padding-bottom:80px}.w{max-width:680px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#c9c5d0;line-height:1.6}h1{font-size:27px}h2{font-size:20px;margin-top:24px}details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:8px 0}summary{font-weight:800}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.65}.en{font-size:16px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}</style></head><body><main class="w"><div class="hero"><h1>TOEIC 多益</h1><p>不再只背單字。每個字都有詞性、搭配、完整商務例句與中文；下方另有 Part 2／5／6／7 原創題與解析。</p></div><h2>高頻字彙＋句子</h2><div id="v"></div><h2>原創題型練習</h2><div id="q"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="toeic-v1.js"></script><script src="toeic-v2.js"></script><script src="toeic-q.js"></script><script>const V=[...TV1,...TV2];document.getElementById('v').innerHTML=V.map((x,i)=>`<details><summary>${i+1}. ${x[0]} · ${x[1]} · ${x[2]}</summary><div class="box"><b>常見搭配：</b> ${x[3]}</div><div class="box en"><b>例句：</b> ${x[4]}<br><small>${x[5]}</small></div><div class="box"><b>自己說：</b>把例句中的人物、時間或工作內容換成自己的，再說一次。</div></details>`).join('');document.getElementById('q').innerHTML=TQ.map((x,i)=>`<details><summary>${x[0]}｜${x[1]}</summary><div class="box">${x[2].split('|').join('<br>')}</div><div class="box"><b>答案 ${x[3]}</b><br>${x[4]}</div></details>`).join('');</script></body></html>
