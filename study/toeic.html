<!doctype html><html lang="zh-Hant"><head><title>TOEIC完整練習</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#ccc7d4;line-height:1.65}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0}.tabs button{border:0;background:#fff;border-radius:99px;padding:9px 12px;white-space:nowrap;font-weight:700}.tabs button.on{background:#6557e8;color:#fff}.card,details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}summary{font-weight:800;line-height:1.55}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.7}.cn{background:#f0edff}.tag{font-size:11px;color:#6557e8;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}.en{font-size:16px;line-height:1.65}.opt{display:block;width:100%;text-align:left;border:0;background:#f2f0f6;padding:10px;border-radius:10px;margin:5px 0}.ok{background:#e7f7f0}.bad{background:#fff0f1}.small{font-size:12px;color:#706b79}button{font:inherit}</style></head><body><main class="w"><div class="hero"><h1>TOEIC｜單字不是只有中文意思</h1><p>100 組高頻字彙／搭配詞／完整例句＋中文；另有 P2–P7 原創題。面試英文、常用英文與多益維持分區，不混在一起。</p></div><div class="tabs"><button class="on" onclick="mode='v';draw(this)">單字＋句子</button><button onclick="mode='q';part='All';draw(this)">全部題目</button><button onclick="mode='q';part='P2';draw(this)">P2</button><button onclick="mode='q';part='P5';draw(this)">P5</button><button onclick="mode='q';part='P6';draw(this)">P6</button><button onclick="mode='q';part='P7';draw(this)">P7</button><button onclick="mode='q';part='P3';draw(this)">P3</button><button onclick="mode='q';part='P4';draw(this)">P4</button></div><div id="x"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="toeic-data.js"></script><script>let mode='v',part='All';function draw(b){if(b){document.querySelectorAll('.tabs button').forEach(z=>z.classList.remove('on'));b.classList.add('on')}if(mode==='v'){x.innerHTML=TOEIC_VOCAB.map((a,i)=>'<details><summary><span class="tag">VOCAB '+(i+1)+'</span> '+a[0]+'｜'+a[1]+'</summary><div class="box"><b>Collocation</b><br>'+a[2]+'</div><div class="box en"><b>Example</b><br>'+a[3]+'</div><div class="box cn">'+a[4]+'</div></details>').join('');return}let q=TOEIC_Q.map((a,i)=>[a,i]).filter(z=>part==='All'||z[0][0]===part);x.innerHTML=q.map(z=>{let a=z[0],i=z[1];return '<div class="card"><span class="tag">'+a[0]+' · Q'+(i+1)+'</span><div class="en" style="font-weight:800;margin:8px 0">'+a[1]+'</div>'+a[2].map((o,j)=>'<button class="opt" onclick="ans(this,'+j+','+a[3]+','+JSON.stringify(a[4]).replace(/"/g,'&quot;')+')">'+String.fromCharCode(65+j)+'. '+o+'</button>').join('')+'</div>'}).join('')}function ans(b,j,k,e){let p=b.parentElement;p.querySelectorAll('.opt').forEach((z,n)=>{z.disabled=true;if(n===k)z.classList.add('ok');else if(n===j)z.classList.add('bad')});p.insertAdjacentHTML('beforeend','<div class="box">'+e+'</div>')}draw()</script></body></html>
