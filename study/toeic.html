<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOEIC 完整練習</title><link rel="stylesheet" href="study-theme.css?v=20261007e"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">TOEIC</div><h1>多益｜字彙＋片語＋P2–P7 題庫</h1><p>分類改成原生錨點，不再靠按鈕切換。點 P2／P3／P4／P5／P6／P7 會直接跳到該區。</p></header><div class="jump"><a href="#vocab">字彙</a><a href="#phrases">片語</a><a href="#P2">P2</a><a href="#P3">P3</a><a href="#P4">P4</a><a href="#P5">P5</a><a href="#P6">P6</a><a href="#P7">P7</a></div><section class="section" id="vocab"><h2>高頻字彙＋完整句子</h2><div id="v"></div></section><section class="section" id="phrases"><h2>高頻片語／搭配詞</h2><div id="ph"></div></section><div id="parts"></div></main><script src="toeic-data.js"></script><script src="toeic-extra.js"></script><script>const Q=[...TOEIC_Q,...TOEIC_EXTRA_Q];v.innerHTML=TOEIC_VOCAB.map((a,i)=>'<details><summary><span class="chip">VOCAB '+(i+1)+'</span>'+a[0]+'｜'+a[1]+'</summary><div class="box"><b>搭配</b><br>'+a[2]+'</div><div class="box"><b>Example</b><br>'+a[3]+'</div><div class="box blue">'+a[4]+'</div></details>').join('');ph.innerHTML=TOEIC_PHRASES.map((a,i)=>'<details><summary><span class="chip">PHRASE '+(i+1)+'</span>'+a[0]+'｜'+a[1]+'</summary><div class="box">'+a[2]+'</div><div class="box blue">'+a[3]+'</div></details>').join('');function qcard(a,i){return '<details><summary><span class="chip">'+a[0]+' · Q'+(i+1)+'</span>'+a[1]+'</summary><div class="box">'+a[2].map((o,j)=>String.fromCharCode(65+j)+'. '+o).join('<br>')+'</div><div class="box warm"><b>答案 '+String.fromCharCode(65+a[3])+'</b><br>'+a[4]+'</div></details>'}parts.innerHTML=['P2','P3','P4','P5','P6','P7'].map(p=>'<section class="section" id="'+p+'"><h2>'+p+' <span class="count">'+Q.filter(a=>a[0]===p).length+'題</span></h2>'+Q.filter(a=>a[0]===p).map(qcard).join('')+'</section>').join('');</script><script src="question-translations.js?v=20261007e"></script><script src="site-enhance.js?v=20261007e"></script></body></html>
