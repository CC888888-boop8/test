<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jenna Daily</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:40px}.w{max-width:680px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#c9c5d0;line-height:1.6}.pill{display:inline-block;background:#eeeaff;color:#6557e8;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}h1{font-size:27px}h2{font-size:19px;margin:24px 0 10px}details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:8px 0}summary{font-weight:800;line-height:1.5}.a{margin-top:11px;line-height:1.7}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px}.warn{background:#fff7e8}.tag{font-size:11px;font-weight:800;color:#6557e8}.back{display:inline-block;margin:0 0 12px;text-decoration:none;color:#6557e8;font-weight:800}.tasks{background:#fff;border-radius:16px;padding:14px;line-height:1.8}</style></head><body><main class="w"><a class="back" href="index.html">← 25 天總表</a><div id="app"></div></main><script src="curriculum.js"></script><script>
const q=new URLSearchParams(location.search),n=Math.max(1,Math.min(25,+q.get('day')||1)),D=STUDY.days[n-1],R=STUDY.research[(n-1)%STUDY.research.length],I=STUDY.interviews[(n-1)%STUDY.interviews.length],E=STUDY.en[(n-1)%STUDY.en.length];
const vs=Array.from({length:8},(_,k)=>STUDY.vocab[((n-1)*2+k)%STUDY.vocab.length]),ps=Array.from({length:5},(_,k)=>STUDY.phrases[((n-1)*2+k)%STUDY.phrases.length]);
document.getElementById('app').innerHTML=`<div class="hero"><span class="pill">DAY ${n} · ${D[0]}</span><h1>${D[1]}</h1><p>今天要做到「能自己說出來」，不是只把卡片看完。</p></div>
<h2>① 研究計畫深度理解｜25–30 分</h2><details open><summary>${R[0]}</summary><div class="a"><div class="tag">白話理解</div>${R[1]}<div class="box"><b>放回你的研究：</b><br>${R[2]}</div><div class="box warn"><b>教授追問／提醒：</b><br>${R[3]}</div><div class="box"><b>輸出任務：</b>關掉答案，用 45 秒自己解釋一次；一定要說到你的會員研究，而不是只背定義。</div></div></details>
<h2>② 中文面試深練｜35–40 分</h2><details open><summary>${I[0]}</summary><div class="a"><div class="tag">教授為什麼問</div>${I[1]}<div class="box"><b>回答骨架：</b><br>${I[2]}</div><div class="box"><b>口語完整版：</b><br>${I[3]}</div><div class="box warn"><b>第一層追問：</b> ${I[4]}<br><b>怎麼接：</b> ${I[5]}</div><div class="box"><b>練法：</b>第一輪看骨架回答；第二輪完全不看稿；第三輪把答案壓到 60–90 秒。</div></div></details>
<h2>③ Interview English｜25–30 分</h2><details><summary>${E[0]}</summary><div class="a"><div class="box"><b>可直接說的版本：</b><br>${E[1]}</div><div class="box"><b>30 秒版練法：</b>只記 3–4 個關鍵字，不逐字背。錄一次自己的聲音，再重講一次。</div><div class="box warn"><b>追問訓練：</b> Why? / Can you give me an example? / How is that related to your future plan?</div></div></details>
<h2>④ TOEIC｜35–40 分</h2><div class="tasks"><b>今日字彙 8 個</b><br>${vs.join('<br>')}<hr><b>文法任務：</b>每題先判斷空格需要名詞、動詞、形容詞還是副詞，再看固定搭配。<br><b>Part 2：</b>聽到 Who/When/Where/Why/How 時先判斷問題類型，不要只抓重複字。<br><b>Part 5：</b>自己用今天 3 個字彙各造一個商務句。<br><b>Part 7：</b>練習先讀題目問什麼，再回文章定位。</div>
<h2>⑤ 常用英文｜20 分</h2><div class="tasks">${ps.join('<br>')}<hr><b>輸出：</b>五個片語至少挑三個，各造一句跟你今天工作、面試準備或生活有關的句子。</div>
<h2>⑥ 今天收尾｜10 分</h2><div class="tasks">□ 不看稿說一次中文面試題<br>□ 不看稿說一次英文題<br>□ 用自己的話解釋研究概念<br>□ TOEIC 錯題記下「錯因」而不是只記答案<br>□ 明天開始前先回想今天三個重點</div>`; </script></body></html>
