<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>完整模擬｜北大 × 陽明交大</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">FULL MOCK</div><h1>完整模擬｜北大 × 陽明交大</h1><p>每場固定包含：個人題、研究、統計、英文個人、國際AI議題、校系延伸、Group、Case、壓力追問。</p><button class="btn" onclick="make()">重新抽一場</button></header><div id="m"></div></main><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="deep-research.js"></script><script src="deep-stats.js"></script><script src="intl-a.js"></script><script src="intl-b.js"></script><script src="intl-c.js"></script><script src="intl-d.js"></script><script src="intl-group.js"></script><script src="school-prep.js"></script><script>function pick(a){return a[Math.floor(Math.random()*a.length)]}function make(){const cn=[...STUDY.interviews,...MORE_INTERVIEWS],en=ENGLISH_BANK,intl=[...INTL_A,...INTL_B,...INTL_C,...INTL_D],r=pick(DEEP_RESEARCH_A),st=pick(DEEP_STATS_A),iss=pick(intl),gr=pick(INTL_GROUP),school=Math.random()<.5?SCHOOL_PREP.ntpu:SCHOOL_PREP.nycu,ext=pick(school.extend);const rows=[["ROUND 1｜中文自介 90秒",pick(cn)[0]],["ROUND 2｜工作／管理 90秒",pick(cn)[0]],["ROUND 3｜研究理解 90秒",r.title],["ROUND 4｜統計口試 90秒",st.title],["ROUND 5｜English Personal 60秒",pick(en)[1]],["ROUND 6｜International Issue 2分鐘",iss.qEn+"｜"+iss.qZh],["ROUND 7｜校系延伸 90秒",ext[0]],["ROUND 8｜Group 10分鐘",gr.title+"｜"+gr.scenario],["ROUND 9｜最後壓力 60秒","教授追問：『你剛才說的是新聞摘要，真正的管理機制和反方在哪裡？』"]];m.innerHTML=rows.map(a=>'<section class="card"><span class="chip">'+a[0]+'</span><div style="font-size:17px;font-weight:800;margin-top:7px">'+a[1]+'</div></section>').join('')}make()</script><script src="site-enhance.js"></script></body></html>
