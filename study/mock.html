<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>完整模擬面試</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">FULL MOCK</div><h1>北大 × 陽明交大完整模擬</h1><p>不是隨機六題。每場固定包含：中文自介、工作／管理、研究理論、統計、英文個人題、英文議題、Group、Case、最後壓力追問。</p><button class="btn" onclick="make()">重新抽一場</button></header><div id="m"></div></main><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="deep-research.js"></script><script src="deep-stats.js"></script><script src="deep-issues.js"></script><script src="deep-group.js"></script><script src="school-prep.js"></script><script>function pick(a){return a[Math.floor(Math.random()*a.length)]}function make(){const cn=[...STUDY.interviews,...MORE_INTERVIEWS],en=ENGLISH_BANK,r=pick(DEEP_RESEARCH_A),st=pick(DEEP_STATS_A),iss=pick(DEEP_ISSUES),gr=pick(DEEP_GROUP),school=Math.random()<.5?SCHOOL_PREP.ntpu:SCHOOL_PREP.nycu,ext=pick(school.extend);const rows=[["ROUND 1｜中文自介 90秒",pick(cn)[0]],["ROUND 2｜工作／管理 90秒",pick(cn)[0]],["ROUND 3｜研究理解 90秒",r.title],["ROUND 4｜統計口試 90秒",st.title],["ROUND 5｜English Personal 60秒",pick(en)[1]],["ROUND 6｜English Issue 2分鐘",iss.q+"｜"+iss.zh],["ROUND 7｜校系延伸 90秒",ext[0]],["ROUND 8｜Group 8–12分鐘",gr.title+"｜"+gr.scenario],["ROUND 9｜最後壓力題 60秒","教授說：『你剛才的回答還是太像工作經驗，學術性在哪裡？』請直接回應。"]];m.innerHTML=rows.map((a,i)=>'<div class="card"><span class="chip">'+a[0]+'</span><div style="font-size:17px;font-weight:800;margin-top:7px">'+a[1]+'</div></div>').join('') }make()</script><script src="site-enhance.js"></script></body></html>
