<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雙校實際型態模擬</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">REALISTIC MOCK</div><h1>北大 × 陽明交大｜依實際形式模擬</h1><p>不再做自由團體討論。北大模擬共同題搶答／輪答；陽明交大模擬中文與英文兩關、3人同場個答＋教授追問。</p><div class="tiles"><button class="tile" onclick="make('ntpu')"><span class="tile-icon">🏫</span>北大模擬<small>共同題＋搶答＋研究</small></button><button class="tile" onclick="make('nycu')"><span class="tile-icon">🎯</span>交大模擬<small>英文抽題＋統計／管理</small></button></div></header><div id="m"></div></main><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="deep-research.js"></script><script src="deep-stats.js"></script><script src="interview-format.js"></script><script src="same-room-extra.js"></script><script src="intl-a.js"></script><script src="intl-b.js"></script><script src="intl-c.js"></script><script src="intl-d.js"></script><script>
function pick(a){return a[Math.floor(Math.random()*a.length)]}
const D=[...SAME_ROOM_DRILLS,...SAME_ROOM_EXTRA],INTL=[...INTL_A,...INTL_B,...INTL_C,...INTL_D];
function card(t,q,note){return '<section class="card"><span class="chip">'+t+'</span><div style="font-size:17px;font-weight:800;margin-top:7px">'+q+'</div>'+(note?'<div class="small" style="margin-top:8px">'+note+'</div>':'')+'</section>'}
function make(mode){
if(mode==="ntpu"){const ds=D.filter(z=>z.school==="北大"),a=pick(ds),b=pick(ds),r=pick(DEEP_RESEARCH_A);m.innerHTML=card("北大｜Round 1｜自介 60秒","請用60秒自我介紹。","多人同場，先輪流自介。")+card("Round 2｜共同題搶答 60–75秒",a.q,"想像已有一位同學先回答；你要補新角度，不要重複。")+card("Round 3｜第二共同題 60–90秒",b.q,"若被教授指定回答，直接給完整個人看法。")+card("Round 4｜研究方向 30秒",r.title,"30秒講研究問題；教授再追方法、變項與可行性。")+card("Round 5｜總結 20–30秒","請把剛才同組可能出現的三種觀點整理成2–3個構面，再給你的結論。","北大部分年份曾出現最後點人總整理；這不是自由討論。");}
else{const ds=D.filter(z=>z.school==="陽明交大"),en=ds.filter(z=>z.type.includes("英文")),zh=ds.filter(z=>!z.type.includes("英文")),e=pick(en),z1=pick(zh),z2=pick(zh),intl=pick(INTL),st=pick(DEEP_STATS_A);m.innerHTML=card("陽明交大｜英文關｜Self-intro 60秒","Tell us about yourself in one minute.","3人同場，但你只回答自己的內容。")+card("英文抽題 90–120秒",e.q,"先完整個答，再接教授追問。")+card("英文追問 30–45秒",e.follow,"直接回答追問，不重背主答案。")+card("中文關｜共同題 60–90秒",z1.q,"可能輪答或搶答；若前面已答，補新角度。")+card("中文關｜統計 45–75秒",st.title,"白話定義→例子→用途／限制。")+card("中文關｜第二題 60–90秒",z2.q,"教授可能沿你的回答一路追問。")+card("加壓題｜近期議題",intl.qZh,"先一句立場，再講商業機制與限制。");}}
make("ntpu");
</script><script src="site-enhance.js"></script></body></html>
