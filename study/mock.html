<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雙校實際型態模擬</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">REALISTIC MOCK</div><h1>北大 × 陽明交大｜考古導向模擬</h1><p>北大只抽北大近年核心題；陽明交大只抽交大AI／財務／ESG／統計等考古軸線。沒有自由團討。</p><div class="tiles"><button class="tile" onclick="make('ntpu')"><span class="tile-icon">🏫</span>北大模擬<small>共同題＋研究＋國際</small></button><button class="tile" onclick="make('nycu')"><span class="tile-icon">🎯</span>交大模擬<small>英文抽題＋統計／管理</small></button></div></header><div id="m"></div></main><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="deep-research.js"></script><script src="deep-stats.js"></script><script src="ntpu-core-issues.js"></script><script src="nycu-core-issues.js"></script><script>
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function card(t,q,n){return '<section class="card"><span class="chip">'+t+'</span><div style="font-size:17px;font-weight:800;margin-top:7px">'+q+'</div>'+(n?'<div class="small" style="margin-top:8px">'+n+'</div>':'')+'</section>'}
function make(mode){
if(mode==="ntpu"){const core=NTPU_CORE_ISSUES.filter(z=>z.type==="歷屆直接"),a=pick(core),b=pick(core),r=pick(DEEP_RESEARCH_A);m.innerHTML=card("北大｜Round 1｜自介 60秒","請用60秒自我介紹。","多人同場，先輪流自介。")+card("Round 2｜共同題搶答 60–90秒",a.qZh,"假設前面已有一位同學回答，你要補新角度。")+card("Round 3｜第二共同題 60–90秒",b.qZh,"完整個答，教授可能沿你的回答追問。")+card("Round 4｜研究方向 30–60秒",r.title,"研究問題→方法→價值。")+card("Round 5｜加壓","如果教授說：『你講的是新聞，不是管理分析』，你怎麼補？","從成本、需求、競爭、資本與風險其中2–3層補機制。");}
else{const direct=NYCU_CORE_ISSUES.filter(z=>z.type==="歷屆直接"),english=direct.filter(z=>!["人口／人資","管理","統計"].includes(z.cat)),zh=direct.filter(z=>["人口／人資","管理","統計","財務／經濟","財務／M&A","財務／統計"].includes(z.cat)),e=pick(english),z1=pick(zh),z2=pick(zh),st=pick(DEEP_STATS_A);m.innerHTML=card("交大｜英文關｜Self-intro 60秒","Tell us about yourself in one minute.","先自介，再進抽題。")+card("英文抽題 90–120秒",e.qEn,e.qZh)+card("英文追問 30–45秒",pick(e.follow),"不要重背主答案，直接答追問。")+card("中文關｜共同題 60–90秒",z1.qZh,"輪答／搶答皆可能；你要自己完整回答。")+card("中文關｜統計 45–75秒",st.title,"白話定義→例子→用途／限制。")+card("中文關｜第二題 60–90秒",z2.qZh,"教授可能沿你的答案深追。");}}
make("ntpu");
</script><script src="site-enhance.js"></script></body></html>
