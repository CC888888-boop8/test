<!doctype html><html lang="zh-Hant"><head><title>完整模擬面試</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#ccc7d4;line-height:1.65}.card{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}.q{font-size:18px;font-weight:850;line-height:1.5}.tag{font-size:11px;color:#6557e8;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}.link{display:inline-block;background:#eeeaff;color:#5d50d8;text-decoration:none;padding:9px 11px;border-radius:10px;font-weight:800;margin:3px}button{border:0;background:#6557e8;color:white;border-radius:12px;padding:11px 14px;font-weight:800;font:inherit}</style></head><body><main class="w"><div class="hero"><h1>完整模擬｜不是隨機六題</h1><p>可切換 7 種場次：中文個人、研究口試、英文個人、英文議題、中英混合、Case、Group。每次重抽一場，先盲答再回題庫檢討。</p><button onclick="make()">重新抽整場</button><p><a class="link" href="english.html">英文題庫</a><a class="link" href="group.html">Group</a><a class="link" href="cases.html">Case</a></p></div><div id="x"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="english-extra.js"></script><script src="issues.js"></script><script src="group2.js"></script><script>function p(a){return a[Math.floor(Math.random()*a.length)]}function make(){let cn=[...STUDY.interviews,...MORE_INTERVIEWS],en=ENGLISH_BANK;let rounds=[['中文自介｜90秒',p(cn)[0]],['中文工作／壓力｜90秒',p(cn)[0]],['研究口試｜90秒',p(cn.filter(z=>/研究|假設|樣本|統計|問卷|數據|變項/.test(z.join(' '))))[0]],['English personal｜60秒',p(en)[1]],['English follow-up｜45秒',p(en)[6]],['English issue｜2分鐘',p(ISSUE_BANK)[1]],['Case｜3分鐘',(()=>{let a=p(CASE2);return a[0]+'：'+a[1]})()],['Group｜8–12分鐘',(()=>{let a=p(GROUP2);return a[1]+'：'+a[2]})()],['Final pressure｜60秒',p(en.filter(z=>z[0]==='壓力'||z[0]==='臨場'))[1]]];x.innerHTML=rounds.map((r,i)=>'<div class="card"><span class="tag">ROUND '+(i+1)+'</span><div>'+r[0]+'</div><div class="q">'+r[1]+'</div></div>').join('')}make()</script></body></html>
