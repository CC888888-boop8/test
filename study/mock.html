<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整模擬</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;border:1px solid #e5e2ea}.q{font-size:18px;font-weight:800;line-height:1.5}button{border:0;border-radius:14px;padding:12px 16px;background:#6557e8;color:#fff;font-weight:800}.sub{color:#706b79;font-size:13px}.links a{color:#cfc8ff;margin-right:12px}</style></head><body><main class="w"><div class="hero"><h1>完整模擬面試</h1><p>一次跑完整場：中文基本→研究→工作／壓力→英文→案例／團體。先回答，不要先開題庫看稿。</p><p><a class="links" href="interview.html">中文題庫</a> <a class="links" href="english.html">英文題庫</a> <a class="links" href="group.html">團體</a></p><button onclick="make()">重新抽一場</button></div><div id="m"></div></main><script src="curriculum.js"></script><script src="interview-more.js"></script><script src="english-1.js"></script><script src="english-2.js"></script><script src="group-data.js"></script><script>function pick(a){return a[Math.floor(Math.random()*a.length)]}function make(){let cn=[...STUDY.interviews,...MORE_INTERVIEWS];let es=pick(ENGLISH_BANK),ca=pick(CASE_BANK),gr=pick(GROUP_BANK);let qs=[['中文暖身｜90秒',pick(cn)[0]],['研究攻防｜90秒',pick(cn.filter(x=>/研究|假設|樣本|數據/.test(x[0]+x[1])))[0]],['工作／壓力｜90秒',pick(cn)[0]],['English｜60秒',es[1]+'｜'+es[2]],['Case｜2分鐘',ca[0]+'：'+ca[1]],['Group｜8分鐘',gr[0]+'：'+gr[1]]];m.innerHTML=qs.map((q,i)=>`<div class="card"><div class="sub">ROUND ${i+1} · ${q[0]}</div><div class="q">${q[1]}</div></div>`).join('')};make()</script></body></html>
