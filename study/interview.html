<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>完整面試母題庫</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px}.w{max-width:680px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#c9c5d0;line-height:1.6}h1{font-size:27px}h2{font-size:20px;margin-top:24px}details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:8px 0}summary{font-weight:800;line-height:1.5}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:9px;line-height:1.7}.warn{background:#fff7e8}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}</style></head><body><main class="w"><div class="hero"><h1>完整面試母題庫</h1><p>不是背答案：先看教授意圖與回答骨架，再自己說，最後才對照口語完整版與追問。</p></div><h2>中文深度題</h2><div id="cn"></div><h2>Interview English</h2><div id="en"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="curriculum.js"></script><script src="interview-more.js"></script><script>document.getElementById('cn').innerHTML=[...STUDY.interviews,...MORE_INTERVIEWS].map((x,i)=>`<details><summary>${i+1}. ${x[0]}</summary><div class="box"><b>教授為什麼問：</b><br>${x[1]}</div><div class="box"><b>回答骨架：</b><br>${x[2]}</div><div class="box"><b>口語完整版：</b><br>${x[3]}</div><div class="box warn"><b>追問：</b> ${x[4]}<br><b>怎麼接：</b> ${x[5]}</div></details>`).join('');document.getElementById('en').innerHTML=STUDY.en.map((x,i)=>`<details><summary>${i+1}. ${x[0]}</summary><div class="box">${x[1]}</div><div class="box warn"><b>再追問自己：</b> Why? / Can you give me an example? / What did you learn?</div></details>`).join('');</script></body></html>
