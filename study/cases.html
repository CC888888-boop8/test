<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案例題庫</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:white;border-radius:24px;padding:22px}details{background:white;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}summary{font-weight:800}.b{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.7}.links a{display:inline-block;margin:8px 6px 0 0;color:#5d50d8}</style></head><body><main class="w"><div class="hero"><h1>商業 × 行銷 × 研究案例題庫</h1><p>每題先自己講2分鐘，再展開看拆解。</p><div class="links"><a href="group.html">團體面試</a> <a href="mock.html">完整模擬</a> <a href="interview.html">回面試</a></div></div><div id="x"></div></main><script src="group-data.js"></script><script>x.innerHTML=CASE_BANK.map((a,i)=>`<details><summary>${i+1}. ${a[0]}｜${a[1]}</summary><div class="b"><b>拆題：</b>${a[2]}</div><div class="b"><b>你的任務：</b>${a[3]}</div></details>`).join('')</script></body></html>
