<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>常用英文</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19181e;padding-bottom:80px}.w{max-width:680px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#c9c5d0;line-height:1.6}h1{font-size:27px}details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:8px 0}summary{font-weight:800}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.65}.use{background:#fff7e8}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}</style></head><body><main class="w"><div class="hero"><h1>常用英文</h1><p>不是單字表。每一組都要知道「什麼時候會用」、看完整自然句，再換成自己的內容說一次。</p></div><div id="p"></div></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="phrases-data.js"></script><script>document.getElementById('p').innerHTML=PHRASES.map((x,i)=>`<details><summary>${i+1}. ${x[0]}｜${x[1]}</summary><div class="box use"><b>什麼時候用：</b><br>${x[2]}</div><div class="box"><b>自然例句：</b><br>${x[3]}<br><small>${x[4]}</small></div><div class="box"><b>常見句型：</b> ${x[5]}</div><div class="box"><b>輪到你：</b>不要照抄例句，換成今天自己的工作、面試準備或生活內容說一句。</div></details>`).join('');</script></body></html>
