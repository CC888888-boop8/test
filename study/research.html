<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>研究理解與統計深度教材</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">RESEARCH + STATISTICS</div><h1>研究計畫不是背名詞｜從零理解到口試回答</h1><p>每一章都用你的研究題目教：白話概念 → 理論 → 套入你的模型 → 研究設計／算例 → 60–90秒口語回答 → 教授追問 → 常見錯誤。</p><div class="tiles"><a class="tile" href="#research"><span class="tile-icon">🔬</span>研究架構與理論<small>題目、理論、問卷、實驗</small></a><a class="tile" href="#stats"><span class="tile-icon">📊</span>統計從零教懂<small>p值、回歸、交互作用、ANOVA</small></a><a class="tile" href="schools.html"><span class="tile-icon">🏫</span>北大／陽明交大<small>只保留主戰學校</small></a><a class="tile" href="mock.html"><span class="tile-icon">🎤</span>研究口試模擬<small>連續追問訓練</small></a></div></header><div class="jump"><a href="#research">研究與理論</a><a href="#stats">統計方法</a><a href="schools.html">北大／交大</a></div><section class="section" id="research"><h2>🔬 研究架構與理論</h2><div id="r"></div></section><section class="section" id="stats"><h2>📊 統計與研究方法</h2><div id="s"></div></section></main><script src="deep-research.js"></script><script src="deep-stats.js"></script><script>function card(x,i){return '<details><summary><span class="chip">'+x.tag+' · '+(i+1)+'</span><div>'+x.title+'</div></summary><div class="box blue"><b>先用白話懂</b><br>'+x.plain+'</div><div class="box"><b>理論／統計細節</b><br>'+x.theory+'</div><div class="box"><b>套入你的研究</b><br>'+x.application+'</div><div class="box"><b>研究設計／公式／實作</b><br>'+x.design+'</div><div class="box warm"><b>教授問時，60–90秒可以這樣答</b><br>'+x.oral+'</div><div class="box"><b>教授再追問</b><br>'+x.follow+'</div><div class="box blue"><b>你怎麼接</b><br>'+x.reply+'</div><div class="box"><b>最常犯的錯</b><br>'+x.pitfall+'</div>'+(x.source?'<a class="src" target="_blank" rel="noopener" href="'+x.source+'">理論來源 ↗</a>':'')+'</details>'}r.innerHTML=DEEP_RESEARCH_A.map(card).join('');s.innerHTML=DEEP_STATS_A.map(card).join('');</script><script src="site-enhance.js"></script></body></html>
