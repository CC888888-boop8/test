<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI 連線設定</title><link rel="stylesheet" href="study-theme.css?v=20261007f"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">AI TUTOR SETUP</div><h1>AI 題目家教｜連線設定</h1><p>這裡只存「後端網址」和網站自己的存取密碼。不要把 OpenAI API key 貼在這裡；API key 只能放在安全後端。</p></header><section class="card"><label class="setting-label">AI 後端網址<input id="ep" placeholder="例如：https://your-study-ai.vercel.app/api/chat"></label><label class="setting-label">網站存取密碼<input id="sec" type="password" placeholder="這是網站後端密碼，不是 OpenAI API key"></label><div class="setting-actions"><button id="save" class="btn">儲存</button><button id="test" class="btn secondary">測試連線</button><a class="btn secondary" href="index.html">回首頁</a></div><div id="status" class="box" style="margin-top:12px"></div></section><section class="card"><h3>目前狀態</h3><p>前端的每題 AI 聊天、題目上下文、你的筆記和每題聊天紀錄已經做好。真正回覆需要這個安全後端。</p><p class="meta">聊天紀錄目前存在你的瀏覽器，不會自動同步到其他裝置。</p></section></main><script src="ai-settings.js?v=20261007f"></script><script src="site-enhance.js?v=20261007e"></script></body></html>
