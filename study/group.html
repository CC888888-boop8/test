<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>多人同場口試｜考古導向</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">SAME-ROOM INTERVIEW</div><h1>多人同場口試｜北大 × 陽明交大</h1><p>不是自由團體討論。這頁只練：第一個回答怎麼答深、前面有人講過時怎麼補、教授追問怎麼接。</p><div class="tiles"><a class="tile" href="#ntpu"><span class="tile-icon">🏫</span>北大共同題<small>搶答／輪答／研究題</small></a><a class="tile" href="#nycu-en"><span class="tile-icon">🎙️</span>交大英文抽題<small>90–120秒個答</small></a><a class="tile" href="#nycu-zh"><span class="tile-icon">🗣️</span>交大中文議題<small>管理／時事／統計</small></a><a class="tile" href="international.html"><span class="tile-icon">📚</span>議題內容<small>先讀考古再練口答</small></a></div></header><section class="section" id="ntpu"><h2>北大｜共同題個答／搶答</h2><div id="n"></div></section><section class="section" id="nycu-en"><h2>陽明交大｜英文抽題個答</h2><div id="ye"></div></section><section class="section" id="nycu-zh"><h2>陽明交大｜中文管理／時事／統計個答</h2><div id="yz"></div></section></main><script src="ntpu-core-issues.js"></script><script src="nycu-core-issues.js"></script><script src="interview-format.js"></script><script>
function drill(z,school){return '<details><summary><span class="chip">'+school+'</span><span class="chip">'+z.type+' · '+z.year+'</span><div>'+z.qZh+'</div><div class="small">'+z.qEn+'</div></summary><div class="box warm"><b>如果你是前面回答的人</b><br>'+z.answerZh+'</div><div class="box blue"><b>如果前面的人已講過</b><br>'+z.later+'</div><div class="box"><b>教授追問</b><ul>'+z.follow.map(a=>'<li>'+a+'</li>').join('')+'</ul></div><div class="box"><b>答題骨架</b><ol>'+z.logic.map(a=>'<li>'+a+'</li>').join('')+'</ol></div>'+(z.source&&z.source.startsWith("http")?'<a class="src" href="'+z.source+'" target="_blank" rel="noopener">查看考生心得來源 ↗</a>':'')+'</details>'}
n.innerHTML=NTPU_CORE_ISSUES.filter(z=>z.type==="歷屆直接").map(z=>drill(z,"北大")).join('');
ye.innerHTML=NYCU_CORE_ISSUES.filter(z=>z.type==="歷屆直接"&&["AI／科技","AI／經濟","AI／企業","ESG","全球化／供應鏈","財務／經濟","財務／M&A","財務／統計"].includes(z.cat)).map(z=>drill(z,"交大英文／專業")).join('');
yz.innerHTML=NYCU_CORE_ISSUES.filter(z=>z.type==="歷屆直接"&&["人口／人資","管理","統計"].includes(z.cat)).map(z=>drill(z,"交大中文")).join('');
</script><script src="site-enhance.js"></script></body></html>
