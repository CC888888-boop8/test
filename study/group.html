<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>多人同場口試｜北大 × 陽明交大</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">SAME-ROOM ORAL INTERVIEW</div><h1>多人同場口試｜不是自由團體討論</h1><p>北大與陽明交大近年多數「團體面試」其實是多人同場、各自回答、搶答／輪答，再接受教授追問。這頁依實際考生流程重做，不再用政大企研式 Group Discussion 練法。</p><div class="tiles"><a class="tile" href="#ntpu"><span class="tile-icon">🏫</span>北大企管<small>多人同場＋搶答／輪答</small></a><a class="tile" href="#nycu"><span class="tile-icon">🎯</span>陽明交大經管<small>3人同場＋中英文兩關</small></a><a class="tile" href="#drills"><span class="tile-icon">🗣️</span>個答深答練習<small>第一答／後答／追問</small></a><a class="tile" href="international.html"><span class="tile-icon">🌍</span>國際議題<small>先讀內容再練個答</small></a></div></header><section class="section" id="ntpu"><h2>北大企管｜實際形式</h2><div id="n"></div></section><section class="section" id="nycu"><h2>陽明交大經管｜實際形式</h2><div id="y"></div></section><section class="section" id="drills"><h2>個人深答／搶答練習</h2><div id="d"></div></section></main><script src="interview-format.js"></script><script src="same-room-extra.js"></script><script>
function schoolCard(z){return '<div class="card"><div class="box warm"><b>目前可確定的程度</b><br>'+z.confidence+'</div><h3>'+z.title+'</h3><div class="box"><b>實際進行方式</b><ol>'+z.mode.map(a=>'<li>'+a+'</li>').join('')+'</ol></div><div class="box blue"><b>你真正要練的能力</b>'+z.skills.map(a=>'<p><b>'+a[0]+'</b><br>'+a[1]+'</p>').join('')+'</div><h3>歷年流程證據</h3>'+z.evidence.map(a=>'<div class="box"><b>'+a[0]+'</b><br>'+a[1]+'<br><a class="src" href="'+a[2]+'" target="_blank" rel="noopener">查看考生心得來源 ↗</a></div>').join('')+'</div>'}
n.innerHTML=schoolCard(INTERVIEW_FORMATS.ntpu);y.innerHTML=schoolCard(INTERVIEW_FORMATS.nycu);
const all=[...SAME_ROOM_DRILLS,...SAME_ROOM_EXTRA];
d.innerHTML=all.map((z,i)=>'<details><summary><span class="chip">'+z.school+' · '+z.type+'</span><div>'+z.q+'</div><div class="small">建議作答 '+z.time+'</div></summary><div class="box warm"><b>如果你是前面回答的人</b><br>'+z.first+'</div><div class="box blue"><b>如果前面的人已講過</b><br>'+z.later+'</div><div class="box"><b>教授追問</b><br>'+z.follow+'</div><div class="box blue"><b>你怎麼接</b><br>'+z.reply+'</div></details>').join('');
</script><script src="site-enhance.js"></script></body></html>
