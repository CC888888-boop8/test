<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團體面試</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19181e}.w{max-width:720px;margin:auto;padding:16px}.hero{background:#17161c;color:white;border-radius:24px;padding:22px}.hero p{color:#cbc7d2;line-height:1.6}details{background:white;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}summary{font-weight:800}.b{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.7}.tip{background:#fff7e8}.links a{display:inline-block;margin:8px 6px 0 0;padding:9px 12px;border-radius:12px;background:#eeeaff;color:#5d50d8;text-decoration:none;font-weight:700}</style></head><body><main class="w"><div class="hero"><h1>團體面試獨立題庫</h1><p>不是教你搶話，而是練進場、承接、建立評估標準、處理衝突、收斂結論與時間管理。</p><div class="links"><a href="cases.html">案例題庫</a><a href="mock.html">完整模擬</a><a href="interview.html">回面試</a></div></div><div id="x"></div></main><script src="group-data.js"></script><script>x.innerHTML=GROUP_BANK.map((a,i)=>`<details><summary>${i+1}. ${a[0]}｜${a[1]}</summary><div class="b"><b>時間：</b>${a[2]}</div><div class="b"><b>解題核心：</b>${a[3]}</div><div class="b"><b>你可以怎麼進場：</b>${a[4]}</div><div class="b tip"><b>壓力追問：</b>${a[5]}</div></details>`).join('')</script></body></html>
