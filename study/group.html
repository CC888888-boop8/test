<!doctype html><html lang="zh-Hant"><head><title>團體面試＋議題討論</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f4f8;color:#19181e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}.w{max-width:760px;margin:auto;padding:16px}.hero{background:#17161c;color:#fff;border-radius:24px;padding:22px}.hero p{color:#ccc7d4;line-height:1.65}.jump{display:flex;gap:7px;overflow:auto;padding:12px 0;position:sticky;top:0;background:#f5f4f8;z-index:4}.jump a{background:#fff;color:#4d4758;text-decoration:none;border-radius:99px;padding:9px 12px;white-space:nowrap;font-weight:800}.section{scroll-margin-top:62px}.section h2{margin:25px 3px 8px}.count{font-size:12px;color:#6b6574}.card,details{background:#fff;border:1px solid #e5e2ea;border-radius:16px;padding:14px;margin:9px 0}summary{font-weight:800;line-height:1.55}.box{background:#f7f6fa;border-radius:12px;padding:11px;margin-top:8px;line-height:1.7}.cn{background:#f0edff}.follow{background:#fff7e8}.tag{font-size:11px;color:#6557e8;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #ddd;padding:9px}.nav a{text-align:center;text-decoration:none;color:#686471;font-size:12px}.en{font-size:16px;line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.link{display:block;background:#eeeaff;color:#5d50d8;text-decoration:none;padding:12px;border-radius:13px;font-weight:800}</style><link rel="stylesheet" href="study-theme.css"></head><body><main class="w"><div class="hero"><h1>Group Interview｜中文 × English × 中英議題</h1><p>原本情境題保留，再加大量議題型 Group Discussion。英文題不只附一句中文：背景、框架、進場句都中英對照。</p><div class="grid"><a class="link" href="#issuegroup">直接到議題型Group</a><a class="link" href="english.html#issues">English Issues</a><a class="link" href="cases.html">Cases</a><a class="link" href="mock.html">完整模擬</a></div></div><section class="section"><h2>商業／管理情境 Group <span class="count" id="n1"></span></h2><div id="base"></div></section><section class="section" id="issuegroup"><h2>英文／中英議題 Group <span class="count" id="n2"></span></h2><div id="more"></div></section></main><nav class="nav"><a href="index.html">今日</a><a href="interview.html">面試</a><a href="toeic.html">多益</a><a href="phrases.html">常用</a><a href="research.html">研究</a></nav><script src="group2.js"></script><script src="group-more.js"></script><script>
n1.textContent=GROUP2.length+'題';n2.textContent=GROUP_MORE.length+'題';
base.innerHTML=GROUP2.map((a,i)=>'<details><summary><span class="tag">'+a[0]+' · GROUP '+(i+1)+'</span><br>'+a[1]+'<br>'+a[2]+'</summary><div class="box"><b>時間</b> '+a[3]+'</div><div class="box"><b>拆解</b><ol>'+a[4].map(z=>'<li>'+z+'</li>').join('')+'</ol></div><div class="box cn"><b>進場示範</b><br>'+a[5]+'</div><div class="box follow"><b>追加追問</b><br>'+a[6]+'</div></details>').join('');
more.innerHTML=GROUP_MORE.map((a,i)=>'<details><summary><span class="tag">'+a[0]+' · ISSUE GROUP '+(i+1)+'</span><br><span class="en">'+a[1]+'</span><br>'+a[2]+'<div class="cn" style="margin-top:7px;padding:7px;border-radius:8px">'+a[3]+'</div></summary><div class="box"><b>Time</b> '+a[4]+'</div><div class="box"><b>Discussion framework</b><ol>'+a[5].map((z,j)=>'<li>'+z+'<br><span class="small">'+a[6][j]+'</span></li>').join('')+'</ol></div><div class="box"><b>English opening</b><br><span class="en">'+a[7]+'</span></div><div class="box cn"><b>中文意思</b><br>'+a[8]+'</div></details>').join('');
</script><script>const oldZh=[["AI客服危機","AI客服錯誤承諾退款，必須決定48小時內如何止血、公關與修正。","我建議把立即處理和長期修正分開。先停止錯誤自動回覆、找出受影響者，再清楚對外溝通與決定公平補償。","追問：是否全面關閉AI？僅在風險無法隔離時全面關閉；否則限制高風險功能。"],["Market Entry","台灣數位服務準備用有限預算進入東南亞新市場，規劃前90天。","正式全面上市前，我會先縮小目標客群並驗證關鍵假設。前三個月重點是學習，而非全面覆蓋。","追問：管理層要求快速擴張？先定義擴張所需的早期證據，並說明未驗證就擴張的成本。"],["品牌公關危機","品牌合作網紅陷入爭議言論，合作內容仍在付費投放。","查證期間先暫停付費擴散，這和認定對方有錯不同，目的是避免繼續增加風險。","追問：這是怕取消文化嗎？決策應根據核實事實、品牌價值、合約與風險，而非純粹網路聲量。"],["Data Privacy","詳細個人資料能提高轉換，但會員未必預期這樣被追蹤，該怎麼做？","不能只看轉換，要看使用者是否合理預期這種資料使用，以及是否必要、透明、可控制。","追問：競品也這樣做？競品行為不能免除自己的責任與風險。"],["人才選擇","只能選一人：經驗強但合作普通，或經驗少但學習能力好。","先定義這份工作成功需要什麼。若需立即承擔高風險，經驗權重較高；若可培養且需高度協作，就提高學習與合作權重。","追問：那你到底選誰？要根據題目職位條件明確做決定。"],["Sustainability","使用更環保的包裝會提高8%成本，要選哪一個？","我不會只把它視為材料成本比較，還要估法規、品牌、客群與能否透過設計或規模降低成本。","追問：消費者說在意永續卻不加價？不能只信口頭偏好，要測實際行為。"],["研究倫理","刪除離群值後結果顯著，是否可以刪除？","不能只因結果變顯著就刪。應有合理、透明的事前資料品質標準，並檢查分析敏感性。","追問：回覆看起來很隨便？用事前定義的品質標準，而非看結果才刪。"],["Pricing Strategy","競品一個月降價25%，你的品牌應跟進嗎？","不能自動跟進；先看客群重疊、價格敏感度、毛利及競品活動是短期還長期。","追問：銷售立刻下滑？先做分群留存與有限優惠，並測是否真由價格造成。"],["新制度公平性","公司獎金強烈綁定個人KPI，團隊擔心合作惡化。","如果工作依賴合作，就不能只看個人指標；應同時考慮個人責任與團隊成果。","追問：團隊獎金鼓勵搭便車嗎？結合清楚個人責任與評估證據。"],["Platform Moderation","平台如何減少有害內容，同時保留正當討論？","規則應清楚、一致、符合傷害比例，並提供申訴與合理透明度。","追問：合法但爭議大的內容呢？合法是一項因素，仍需依平台規則、程序與一致性判斷。"],["裁員溝通","企業需要削減成本、考慮裁員10%，如何決策與溝通？","成本可能必須降低，但應依一致且公平的業務標準決策，並重新設計留任者的工作負荷。","追問：直接裁績效差的？還需看職務必要性、未來能力、公平與法規。"],["New Graduate Hiring","徵才應重技能還是潛力？","兩者都重要。初階職務可更重學習能力與解題證據，高風險即戰力職務則更重已驗證技能。","追問：怎麼公平衡量潛力？用結構化測試與一致標準。"]];document.querySelectorAll('#base details').forEach(el=>{const title=el.querySelector('summary')?.textContent||'';const z=oldZh.find(a=>title.includes(a[0]));if(z){el.insertAdjacentHTML('beforeend','<div class="box cn"><b>中文題意／背景</b><br>'+z[1]+'</div><div class="box cn"><b>英文示範中文</b><br>'+z[2]+'</div><div class="box cn"><b>英文追問與答案中文</b><br>'+z[3]+'</div>')}});</script><script src="site-enhance.js"></script></body></html>
