<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>歷屆面試心得題</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">HISTORICAL INTERVIEW EXPERIENCES</div><h1>歷屆考生回憶題｜中英對照</h1><p>按校系整理。這些是過往考生分享、整理與改寫的題目，不代表學校正式公布題本；英文翻譯與答案是針對你的背景新寫的練習稿。</p></header><div class="jump"><a href="#ntpu">北大企管</a><a href="#nycu">陽明交大經管</a><a href="english.html">英文完整題庫</a></div><div id="h"></div></main><script src="history-data.js"></script><script src="history-extra.js"></script><script src="history-verified.js"></script><script>const ids={"北大企管":"ntpu","陽明交大經管":"nycu","台科企管":"ntust","北市大行銷":"ut","北市大行銷與管理":"ut"};const entries=[...HISTORY_BANK.map(x=>({school:x[0],kind:"考生回憶整理",title:x[2],eng:x[3],zh:x[4],en:x[5],follow:x[6],followEn:x[7],followZhAns:x[8],followEnAns:x[9],src:HISTORY_SOURCES[x[1]]?.[1]||""})),...HISTORY_EXTRA.map(x=>({school:x[0],kind:"考生回憶整理",title:x[2],eng:x[3],zh:x[4],en:x[5],follow:x[6],followEn:x[7],followZhAns:x[8],followEnAns:x[9],src:HISTORY_SOURCES_EXTRA[x[1]]?.[1]||""})),...VERIFIED_HISTORY.map(x=>({school:x[0],kind:x[1]+"｜考生回憶",title:x[2],eng:x[3],zh:x[4],en:x[5],follow:x[6],followEn:x[7],followZhAns:x[8],followEnAns:x[9],src:x[10]}))];function bx(t,s,c=""){return '<div class="box '+c+'"><b>'+t+'</b><div>'+s+'</div></div>'}const groups=[["北大企管","ntpu"],["陽明交大經管","nycu"]];h.innerHTML=groups.map(([name,id])=>{let rows=entries.filter(x=>id==="ut"?x.school.startsWith("北市大"):x.school===name);return '<section class="section" id="'+id+'"><h2>'+name+' <span class="count">'+rows.length+'題</span></h2>'+rows.map((x,i)=>'<details><summary><span class="chip">'+x.kind+' · '+(i+1)+'</span><div>'+x.title+'</div><div class="small">'+x.eng+'</div></summary>'+bx('中文參考回答',x.zh,'blue')+bx('English answer',x.en)+bx('中文追問',x.follow,'warm')+bx('English follow-up',x.followEn)+bx('追問回答中文',x.followZhAns,'blue')+bx('Follow-up answer',x.followEnAns)+(x.src?'<a class="src" target="_blank" rel="noopener" href="'+x.src+'">查看考生心得來源 ↗</a>':'')+'</details>').join('')+'</section>'}).join('');</script><script src="site-enhance.js"></script></body></html>
