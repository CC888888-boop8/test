<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>北大企管 × 陽明交大經管 專區</title><link rel="stylesheet" href="study-theme.css"></head><body><main class="wrap"><header class="hero"><div class="eyebrow">SCHOOL-SPECIFIC PREP</div><h1>只準備北大企管 × 陽明交大經管</h1><p>台科與北市大從主戰頁移除。這裡整理歷屆回憶反覆出現的能力、前人建議準備範圍，以及依那些方向延伸的可能追問。</p></header><div class="jump"><a href="#ntpu">北大企管</a><a href="#nycu">陽明交大經管</a><a href="history.html">兩校考古題</a><a href="research.html">研究／統計</a></div><div id="x"></div></main><script src="school-prep.js"></script><script>function render(k,id){const a=SCHOOL_PREP[k];return '<section class="section" id="'+id+'"><h2>'+a.title+'</h2><div class="box warm"><b>面試準備重點</b><br>'+a.exam+'</div><h3>考前要讀到什麼程度</h3>'+a.read.map(z=>'<div class="card"><b>'+z[0]+'</b><br>'+z[1]+'</div>').join('')+'<h3>歷屆回憶反覆出現的題型</h3>'+a.history.map((z,i)=>'<div class="box">'+(i+1)+'. '+z+'</div>').join('')+'<h3>依考古方向延伸的可能題</h3>'+a.extend.map((z,i)=>'<details><summary>'+(i+1)+'. '+z[0]+'</summary><div class="box blue"><b>準備方向</b><br>'+z[1]+'</div></details>').join('')+'</section>'}x.innerHTML=render("ntpu","ntpu")+render("nycu","nycu");</script><script src="site-enhance.js"></script></body></html>
